# Igienă dependențe — fără Claude, fără cost. Copiază în <proiect>/.github/dependabot.yml
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
  - package-ecosystem: "nuget"      # backend C#/.NET
    directory: "/"
    schedule: { interval: "weekly" }
