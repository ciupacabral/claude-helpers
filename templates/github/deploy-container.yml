# Build + push imagine container in GHCR. FARA Claude, fara cheie API.
# Copiaza in <proiect>/.github/workflows/deploy-container.yml
name: deploy-container

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # automat — fara secret manual

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
# Deploy-ul efectiv (pull imagine pe server/VPS, sau Render/Fly/Railway) il configuram separat,
# in functie de unde rulezi containerul.
